<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fondo Oscuro de la Marca -->
  <rect width="1200" height="630" fill="#181818"/>
  
  <!-- Marco Rojo Carmesí Elegante -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#E52E2E" stroke-width="4" rx="12"/>

  <!-- Objeto Floral Ilustrado en el Centro -->
  <g transform="translate(600, 260) scale(4.5)">
    <!-- Centro dorado -->
    <circle cx="0" cy="0" r="5.5" fill="#D4AF37"/>
    <!-- Pétalos principales -->
    <ellipse cx="0" cy="-17" rx="6.6" ry="13" fill="#FFFFFF"/>
    <ellipse cx="0" cy="17" rx="6.6" ry="13" fill="#FFFFFF"/>
    <ellipse cx="-17" cy="0" rx="13" ry="6.6" fill="#FFFFFF"/>
    <ellipse cx="17" cy="0" rx="13" ry="6.6" fill="#FFFFFF"/>
    <!-- Pétalos diagonales -->
    <ellipse cx="-12" cy="-12" rx="6" ry="12" fill="#FFFFFF" transform="rotate(-45 -12 -12)"/>
    <ellipse cx="12" cy="-12" rx="6" ry="12" fill="#FFFFFF" transform="rotate(45 12 -12)"/>
    <ellipse cx="-12" cy="12" rx="6" ry="12" fill="#FFFFFF" transform="rotate(45 -12 12)"/>
    <ellipse cx="12" cy="12" rx="6" ry="12" fill="#FFFFFF" transform="rotate(-45 12 12)"/>
  </g>

  <!-- Textos Editoriales -->
  <text x="600" y="450" font-family="'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">GOLDEN MAISON</text>
  <text x="600" y="500" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="600" fill="#E52E2E" text-anchor="middle" letter-spacing="8">STUDIO FLORAL · PANAMÁ</text>
</svg>
